plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'dev.dsh.voice'
version = '1.0.0'

def speechRepository = new File(projectDir, 'maven')
rootProject.allprojects {
  repositories { maven { url speechRepository.toURI() } }
}
android {
  namespace 'dev.dsh.voice'
  defaultConfig { testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"; minSdkVersion 24; consumerProguardFiles "consumer-rules.pro" }
}
dependencies {
  implementation 'com.k2fsa.sherpa:sherpa-onnx:2.0.1'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
