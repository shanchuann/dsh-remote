name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run plugin tests
        working-directory: plugin
        run: node test/run-all.mjs

  app:
    name: App typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: app
        run: node --test src/lib/__tests__/*.test.ts src/lib/__tests__/*.test.mjs
