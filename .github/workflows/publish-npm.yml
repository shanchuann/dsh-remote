name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Set up npm trusted publishing
        run: |
          npm install --global npm@11.8.0
          node --version
          npm --version
      - name: Check release metadata
        working-directory: plugin
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const repository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          assert.equal(pkg.repository?.url, repository, 'repository.url must match the publishing repository');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'release tag must match the plugin version');
          }
          console.log(`Publishing ${pkg.name}@${pkg.version}`);
          NODE
      - name: Check npm version
        id: npm-version
        working-directory: plugin
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
          if (response.status !== 404 && !response.ok) {
            throw new Error(`npm version lookup failed: HTTP ${response.status}`);
          }
          const exists = response.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!exists}\n`);
          console.log(exists ? `${pkg.name}@${pkg.version} already exists; skipping publish` : `${pkg.name}@${pkg.version} is not published`);
          NODE
      - name: Test
        working-directory: plugin
        run: node test/run-all.mjs
      - name: Publish
        if: steps.npm-version.outputs.publish == 'true'
        working-directory: plugin
        run: npm publish --access public --provenance
